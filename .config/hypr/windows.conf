# windowrule = float, class:^(CopyQ)$
windowrule = float, title:^(.*[Cc]opy[Qq].*)$
windowrule = size 800 600, title:^(.*[Cc]opy[Qq].*)$
windowrule = center, class:^(copyq)$
windowrule = float, initialTitle:^(copyq_edit)$
windowrule = size 800 600, initialTitle:^(copyq_edit)$
windowrule = center, initialTitle:^(copyq_edit)$
windowrule = float, initialTitle:^(popup_)$
windowrule = size 800 600, initialTitle:^(popup_)$
windowrule = center, initialTitle:^(popup_)$

windowrule = float, initialTitle:^(R_)$
windowrule = size 90% 90%, initialTitle:^(R_)$
windowrule = center, initialTitle:^(R_)$

windowrule = float, title:^(ssh-chat)$
windowrule = size 500 400, title:^(ssh-chat)$
windowrule = move 5 630, title:^(ssh-chat)$
windowrule = opacity 1.0 override 0.1 override, title:^(ssh-chat)$
windowrule = workspace 1, title:^(ssh-chat)$

# KeePassXC dialogs - pin all popups (any window without .kdbx in title)
windowrule = pin, class:^(org\.keepassxc\.KeePassXC)$, floating:1
