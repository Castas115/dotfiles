windowrule = float on, match:title ^(.*[Cc]opy[Qq].*)$
windowrule = size 800 600, match:title ^(.*[Cc]opy[Qq].*)$
windowrule = center on, match:class ^(copyq)$
windowrule = float on, match:initial_title ^(copyq_edit)$
windowrule = size 800 600, match:initial_title ^(copyq_edit)$
windowrule = center on, match:initial_title ^(copyq_edit)$
windowrule = float on, match:initial_title ^(popup_)$
windowrule = size 800 600, match:initial_title ^(popup_)$
windowrule = center on, match:initial_title ^(popup_)$

windowrule = float on, match:initial_title ^(R_)$
windowrule = size (monitor_w*0.85) (monitor_h*0.85), match:initial_title ^(R_)$
windowrule = center on, match:initial_title ^(R_)$

windowrule = float on, match:initial_title ^(music)$
windowrule = size (monitor_w*0.6) (monitor_h*0.7), match:initial_title ^(music)$
windowrule = center on, match:initial_title ^(music)$

windowrule = float on, match:initial_title ^(ssh-chat)$
windowrule = size 500 400, match:initial_title ^(ssh-chat)$
windowrule = move 5 630, match:initial_title ^(ssh-chat)$
windowrule = opacity 1.0 override 0.1 override, match:initial_title ^(ssh-chat)$
windowrule = workspace 1, match:initial_title ^(ssh-chat)$

# KeePassXC dialogs - pin all popups (any window without .kdbx in title)
windowrule = pin on, match:class ^(org\.keepassxc\.KeePassXC)$, match:float 1

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class ^(.*)$

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^()$, match:title ^()$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
