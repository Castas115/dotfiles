# host.conf es especifico de cada maquina y NO esta versionado (ver .gitignore).
# Define PATH/XDG_DATA_DIRS y elige el windows-*.conf de la version de Hyprland
# que corra ese equipo. Si falta, Hyprland arranca sin reglas ni entorno.
# Plantilla: host.conf.example
source = ~/.config/hypr/host.conf

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/workspaces.conf
